<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Uman Sheikh</title>
    <link rel="stylesheet" href="../styles/contact.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/favicon.svg">
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav>
            <div class="left">Uman's Portfolio</div>
            <div class="right">
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about-me.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="#">Contact Me</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact <span class="purple">Me</span></h1>
            
            <div class="contact-container">
                <div class="contact-info">
                    <h2>Let's Connect</h2>
                    <p>Feel free to reach out for collaborations, opportunities, or just to say hello!</p>
                    
                    <div class="info-items">
                        <div class="info-item">
                            <div class="icon">📧</div>
                            <div class="details">
                                <h3>Email</h3>
                                <p>l1f21bsse0611@ucp.edu.pk</p>
                            </div>
                        </div>
                        
                        <div class="info-item">
                            <div class="icon">📱</div>
                            <div class="details">
                                <h3>Phone</h3>
                                <p>+92 123 456789</p>
                            </div>
                        </div>
                        
                        <div class="info-item">
                            <div class="icon">📍</div>
                            <div class="details">
                                <h3>Location</h3>
                                <p>Pakistan</p>
                            </div>
                        </div>
                    </div>

                    <div class="social-links">
                        <a href="#" class="social-btn">LinkedIn</a>
                        <a href="#" class="social-btn">GitHub</a>
                        <a href="#" class="social-btn">Twitter</a>
                    </div>
                </div>

                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your form submission logic here
            alert('Thank you for your message! I will get back to you soon.');
            this.reset();
        });
    </script>
</body>
</html>
