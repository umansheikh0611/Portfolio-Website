name: Lint CSS

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install create-stylelint

      - name: Lint CSS files
        run: npx stylelint "**/*.css" --fix
