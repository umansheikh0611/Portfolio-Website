name: Lint HTML  
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install htmlhint --save-dev

      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
